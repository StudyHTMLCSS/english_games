<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Игровой портал: English Games</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1429;
      color: #fff;
      text-align: center;
      padding: 40px 20px;
      margin: 0;
    }
    h1 {
      margin-bottom: 40px;
      color: #ffd93b;
      font-size: 36px;
      text-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .games-container {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      max-width: 1000px;
      margin: 0 auto;
    }
    .game-card {
      background: linear-gradient(160deg, #3a2a68, #241b3e);
      border: 3px solid #6ef7ff;
      border-radius: 20px;
      padding: 25px 20px;
      width: 260px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .game-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 15px 30px rgba(110, 247, 255, 0.4);
      border-color: #ffd93b;
    }
    .game-image {
      width: 100%;
      height: 160px;
      border-radius: 12px;
      background: #120d1f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      margin-bottom: 20px;
      border: 2px solid rgba(255,255,255,0.1);
      object-fit: cover;
    }
    .game-card h2 {
      font-size: 22px;
      margin: 0 0 10px 0;
      color: #7cfc9a;
    }
    .game-card p {
      font-size: 14px;
      color: #d1c5ea;
      margin: 0;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <h1>Обучающие игры по английскому</h1>
  
  <div class="games-container">
    <a href="game1.html" class="game-card">
      <div class="game-image">🐍</div>
      <h2>game1. Snake</h2>
      <p>Отработка окончания -S (he/she/it) в Present Simple.</p>
    </a>

    <a href="game2.html" class="game-card">
      <div class="game-image">🧟</div>
      <h2>game2. Zombi</h2>
      <p>Фразовые глаголы. Защити эльфов от нашествия зомби!</p>
    </a>

    <a href="game3.html" class="game-card">
      <div class="game-image">🫧</div>
      <h2>game3. Grammar Bubbles</h2>
      <p>Конструкция There was / There were. Лопай правильные пузыри!</p>
    </a>
  </div>

</body>
</html>
