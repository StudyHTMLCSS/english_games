<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Hub - Обучающие игры</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: url('image.png') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .hub-container {
      display: flex;
      justify-content: center;
      gap: 35px;
      flex-wrap: wrap;
      max-width: 1100px;
      width: 100%;
      margin-top: 140px;
    }

    .game-card {
      width: 260px;
      height: 380px;
      text-decoration: none;
      display: block;
      border-radius: 25px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .game-card:hover {
      transform: scale(1.03);
      box-shadow: 0 0 25px rgba(110, 247, 255, 0.4);
    }
  </style>
</head>
<body>

  <div class="hub-container">
    <!-- Ссылка на игру 1 (Snake) -->
    <a href="game1.html" class="game-card"></a>

    <!-- Ссылка на игру 2 (Zombie) -->
    <a href="game2.html" class="game-card"></a>

    <!-- Ссылка на игру 3 (Grammar Bubbles) -->
    <a href="game3.html" class="game-card"></a>
  </div>

</body>
</html>
